<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glossaire Médical — L.S.E.S.</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrapper nav">
      <a class="brand" href="index.html">
        <img src="assets/img/logo.png" alt="L.S.E.S.">
        <span>Glossaire Médical — L.S.E.S.</span>
      </a>
      <nav class="menu">
        <a href="index.html">Accueil</a>
        <a href="chirurgie.html">Chirurgie</a>
        <a href="gynecologie.html">Gynécologie</a>
        <a href="kinesitherapie.html">Kinésithérapie</a>
        <a href="medecinelegale.html">Médecine légale</a>
      </nav>
    </div>
  </header>

  <main class="wrapper">
    <section class="hero">
      <h1>Glossaire Médical L.S.E.S.</h1>
      <p>Termes, définitions et instruments utilisés par les équipes médicales.</p>
      <input type="text" id="searchGloss" placeholder="Rechercher un terme..." style="width:80%;padding:8px;margin:20px auto;display:block;background:#001c2c;border:1px solid #00c8ff;color:#fff;border-radius:8px;">
    </section>
    <section id="glossContainer"></section>
  </main>

  <footer class="footer">© 2025 PiouPiou le Magnifique — ProjectV</footer>
  <script src="assets/js/app.js"></script>
  <script>
    const terms = [
      {t:"TENS",d:"Stimulation électrique transcutanée pour la gestion de la douleur."},
      {t:"Électrode",d:"Dispositif de conduction utilisé pour stimuler ou enregistrer une activité nerveuse."},
      {t:"Protocole",d:"Ensemble de règles ou procédures médicales standardisées."},
      {t:"Anesthésie",d:"Procédure médicale visant à supprimer la douleur lors d’une intervention."}
    ];
    const container=document.getElementById("glossContainer");
    const search=document.getElementById("searchGloss");
    const render=(f="")=>{
      container.innerHTML=terms
        .filter(e=>e.t.toLowerCase().includes(f.toLowerCase()))
        .map(e=>`<article class="tile"><h3>${e.t}</h3><p>${e.d}</p></article>`).join("");
    };
    render();
    search.addEventListener("input",e=>render(e.target.value));
  </script>
</body>
</html>
