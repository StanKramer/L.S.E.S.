<!-- assets/img/logo.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">L.S.E.S. — Guide Médical</title>
  <desc id="desc">Logo IA néon bleu pour le L.S.E.S., avec un cœur stylisé et un tracé ECG.</desc>

  <defs>
    <linearGradient id="neo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#73E5FF"></stop>
      <stop offset="100%" stop-color="#3FC8FF"></stop>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="b"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    <style>
      text {
        font-family: 'Oxanium', sans-serif;
        font-weight: 700;
        fill: #BFEFFF;
      }
      .ring { fill:none; stroke:url(#neo); stroke-width:6; filter:url(#glow); }
      .heart, .pulse { fill:none; stroke:url(#neo); stroke-width:5; stroke-linecap:round; stroke-linejoin:round; filter:url(#glow); }
    </style>
  </defs>

  <!-- Cercle -->
  <g transform="translate(90,90)">
    <circle r="72" class="ring"></circle>
    <path class="heart" d="M -12 -12 c -14 -22 -50 -10 -50 16 c 0 27 31 42 50 58 c 19 -16 50 -31 50 -58 c 0 -26 -36 -38 -50 -16z"></path>
    <path class="pulse" d="M -52 10 H -24 l 8 -12 l 10 28 l 12 -38 l 8 22 h 60"></path>
  </g>

  <!-- Texte -->
  <g transform="translate(180,75)">
    <text font-size="54" letter-spacing="0.06em">L.S.E.S.</text>
    <text font-size="22" y="46" opacity="0.9">GUIDE MÉDICAL</text>
  </g>
</svg>
