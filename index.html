  <style>
    /* ===============================
       MENUS DÉROULANTS DYNAMIQUES
       =============================== */
    nav ul li {
      position: relative;
    }

    nav ul li ul {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background: rgba(10, 25, 45, 0.95);
      border: 1px solid rgba(90, 209, 255, 0.2);
      border-radius: 10px;
      list-style: none;
      padding: 8px 0;
      margin: 0;
      min-width: 180px;
      box-shadow: 0 0 15px rgba(90, 209, 255, 0.1);
      z-index: 1000;
    }

    nav ul li:hover ul {
      display: block;
      animation: fadeInMenu 0.3s ease;
    }

    nav ul li ul li {
      padding: 8px 16px;
    }

    nav ul li ul li a {
      color: #bfeaff;
      text-decoration: none;
      display: block;
      transition: all 0.3s ease;
      font-size: 0.9rem;
    }

    nav ul li ul li a:hover {
      color: var(--accent);
      text-shadow: 0 0 6px var(--accent);
      transform: translateX(4px);
    }

    @keyframes fadeInMenu {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
